```yaml
name: Java CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  ci-build-test-sonar:
    name: Build, Test, Coverage and Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build, Test, JaCoCo, SonarCloud and Quality Gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn clean verify sonar:sonar
          -Dsonar.projectKey=aditya-0122_cobaRepo
          -Dsonar.organization=aditya-0122
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.qualitygate.wait=true
```
