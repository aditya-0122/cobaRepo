name: Java CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # TAHAP CI: Kompilasi / Build (Tanpa Test)
  # ==========================================
  ci-build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      # fetch-depth: 0 sudah dihapus karena tidak lagi dibutuhkan jika tidak ada SonarCloud

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # Perintah 'package' akan membuat file .jar, dan '-DskipTests' akan mengabaikan unit test
    - name: Run Maven Build
      run: mvn clean package -DskipTests

    # Simpan hasil kompilasi (.jar) agar tidak hilang dan bisa dipakai untuk rilis
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rilis-aplikasi-java
        path: target/*.jar
        retention-days: 1

  # ==========================================
  # TAHAP CD: Simulasi Deployment ke Server
  # ==========================================
  cd-deploy:
    name: Deploy Application
    needs: ci-build # Harus menunggu tahap ci-build selesai tanpa error
    # Deployment hanya dieksekusi jika perubahan di-push atau di-merge ke branch 'main'
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Download Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: rilis-aplikasi-java
        path: target/

    # Simulasi eksekusi akhir. Di dunia nyata, bagian ini diganti dengan
    # script SSH/SCP untuk mengirim file .jar ke server VPS
    - name: Execute Deployment
      run: |
        echo "Artifact berhasil diunduh!"
        echo "Menyiapkan aplikasi Java untuk di-deploy ke environment Production..."
        ls -la target/