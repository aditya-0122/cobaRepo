name: Java CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci-build-test-sonar:
    name: Build, Test and Analyze
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Penting agar SonarCloud bisa membaca seluruh histori commit

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build, Test, Package, and SonarCloud Scan
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: >
        mvn clean verify sonar:sonar 
        -Dsonar.projectKey=aditya-0122_cobaRepo 
        -Dsonar.organization=aditya-0122 
        -Dsonar.host.url=https://sonarcloud.io